<!DOCTYPE html>

<html lang="zh-CN">
<head>

  <title>示例电影 (2023)</title>
  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "Movie",
    "name": "示例电影",
    "image": "https://img1.doubanio.com/view/photo/s_ratio_poster/public/p-sample.jpg",
    "genre": ["剧情", "科幻"],
    "datePublished": "2023-04-01",
    "director": [{ "@type": "Person", "name": "张三" }],
    "actor": [
      { "@type": "Person", "name": "李四" },
      { "@type": "Person", "name": "王五" }
    ],
    "aggregateRating": { "ratingValue": "7.6", "ratingCount": "12345" }
  }
  </script>
</head>
<body>
  <div id="wrapper">
    <div id="content">
      <h1><span property="v:itemreviewed">示例电影</span></h1>
      <div id="info">合成条目信息骨架（仅结构锚点用）</div>
    </div>
  </div>
