<!DOCTYPE html>
<!--

  覆盖 @type 判定与 genre/aggregateRating 缺省容忍。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>示例剧集</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TVSeries",
    "name": "示例剧集",
    "image": "https://img9.doubanio.com/view/photo/s_ratio_poster/public/p-sample2.jpg",
    "datePublished": "2021-06-01"
  }
  </script>
</head>
<body>
  <div id="wrapper"><div id="content"><h1><span property="v:itemreviewed">示例剧集</span></h1></div></div>
</body>
</html>
