appId: com.qyplayer.app
productName: QY Player
copyright: Copyright © 2025 QY Player Team
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - resources/**/*
extraResources:
  - from: out
    to: out
# Electron 二进制来源：
# - Linux 本地打包脚本用 -c.electronDist=node_modules/electron/dist 指向本地已装
#   Electron，避免联网下载（国内环境经常卡死）
# - win/mac 打包（CI）不指定，按 electronDownload.mirror 下载对应架构的发行包
#   （mac 要出 x64+arm64 双架构，固定本地目录只有宿主架构）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# Linux 通用配置
linux:
  category: AudioVideo
  maintainer: QY Player Team
  vendor: QY Player Team
  description: 以 MPV 为内核的本地/在线混合媒体播放器
  synopsis: MPV-based media player with Jellyfin/Emby support
  executableName: qy-player
  icon: build/icons
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: pacman
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
    - target: tar.xz
      arch:
        - x64

# Debian/Ubuntu/Deepin 专用配置
deb:
  packageName: qy-player
  priority: optional
  depends:
    - mpv
    - libmpv1
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libappindicator3-1

# RedHat/CentOS/Fedora/openSUSE 专用配置
rpm:
  packageName: qy-player
  depends:
    - mpv
    - libmpv
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret

# Arch Linux 专用配置
pacman:
  packageName: qy-player
  depends:
    - mpv
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - libsecret

# AppImage 专用配置
# 产物名统一用 ${name}（qy-player，无空格）而不是 ${productName}（QY Player）：
# 带空格的文件名在上传时会被两边各自 sanitize——electron-builder 自己传成 `-`，
# release job 里的 action-gh-release 传成 `.`，发布页上同一个产物就出现两份
# （1.5.1 及以前的版本都这样）。Linux 的 deb/rpm/pacman 本来就是 qy-player，
# 这里改完三端一致。
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}

# Windows 专用配置（QYP3-064：NSIS 安装版 + 免安装 portable，x64）
win:
  icon: build/icon.png
  # 未签名（无证书）：SmartScreen 会提示，由发布说明告知用户
  # 注：electron-builder 26 把 signingHashAlgorithms 挪进了 signtoolOptions，
  # 且它只在真的签名时才有意义——本项目不签名，故整条删掉而不是搬家
  extraResources:
    # scripts/fetch-mpv-win.js 产出的 mpv.exe（+ d3dcompiler_47.dll）
    - from: build/mpv-win
      to: mpv
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${name}-Portable-${version}.${ext}

# macOS 专用配置（QYP3-064：dmg，x64 + arm64）
mac:
  category: public.app-category.video
  icon: build/icon.png
  # 未签名（无开发者证书）：首次打开需右键 → 打开 绕过 Gatekeeper
  identity: null
  extraResources:
    # scripts/collect-mpv-mac.sh 产出的 mpv + lib/（dylib 闭包）
    - from: build/mpv-mac
      to: mpv
  target:
    - target: dmg
      arch:
        - x64
        - arm64

# ${name} 而非 ${productName} 的理由见上面 appImage 的注释
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
