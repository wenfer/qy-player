name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # rpm: needed for the rpm target; libarchive-tools: provides bsdtar for the pacman target
          sudo apt-get install -y rpm libarchive-tools

      - name: Build and package
        run: npm run dist:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*
          if-no-files-found: error

  build-windows:
    # 不用 windows-latest：它已经是 windows-2025-vs2026（**Visual Studio 2026**），
    # 而 node-gyp（含 11.x，只映射 major 15/16/17 → 2017/2019/2022）认不出 VS 18，
    # 报 "Could not find any Visual Studio installation to use"——1.5.0 首次发布
    # 实测就是这么挂的（挂在下游 `npm ci` 的 postinstall 重建 better-sqlite3）。
    # windows-2022 仍带 VS 2022，等 node-gyp 支持 VS2026 再考虑换回 latest。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist:win 内部会跑 scripts/fetch-mpv-win.js（GitHub API 查 release →
      # 下载 7z → 解压到 build/mpv-win）；GitHub runner 自带 7-Zip
      - name: Build and package
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*
          if-no-files-found: error

  # mac 的 x64/arm64 必须分架构构建：better-sqlite3 原生模块按 runner
  # 宿主架构编译，arm64 runner 上打出的 x64 包里会是 arm64 模块（Intel
  # 机器上 better-sqlite3 直接加载失败）
  #
  # runner 标签（2026-09 起，见 actions/runner-images README）：`macos-13`
  # 已退役——用它会永远排在队列里（1.5.0 首次发布实测：mac-x64 job
  # queued 30+ 分钟没等到 runner）。macOS 15 之后**不带后缀的标签是
  # arm64**（`macos-15`/`macos-26`/`macos-latest` 全是 arm64），Intel 的
  # 标准标签是 `macos-15-intel`（`*-large` 属于付费大规格，别用）。
  build-mac-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mpv (Homebrew)
        run: brew install mpv

      - name: Build and package
        run: |
          npm run typecheck
          npm run build:main
          npm run build:preload
          npm run build:renderer
          bash scripts/collect-mpv-mac.sh
          npx electron-builder --mac dmg --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder 给 **macOS** 写的更新元数据文件名不带架构后缀
      # （getUpdateInfoFileName 只对 Linux 加 -<arch>），两个 mac job 的产物里
      # 都是 dist/latest-mac.yml，release job 合并制品时会互相覆盖。按架构改名，
      # 发布前再合成一份（scripts/merge-mac-update-info.mjs）。
      - name: Tag update metadata by arch
        run: mv dist/latest-mac.yml dist/latest-mac-x64.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-x64-builds
          path: dist/*
          if-no-files-found: error

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mpv (Homebrew)
        run: brew install mpv

      - name: Build and package
        run: |
          npm run typecheck
          npm run build:main
          npm run build:preload
          npm run build:renderer
          bash scripts/collect-mpv-mac.sh
          npx electron-builder --mac dmg --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同上：改名为 latest-mac-arm64.yml，避免与 x64 那份同名覆盖
      - name: Tag update metadata by arch
        run: mv dist/latest-mac.yml dist/latest-mac-arm64.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-builds
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - build-linux
      - build-windows
      - build-mac-x64
      - build-mac-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # 发布说明取自 CHANGELOG 里本版本的段落：workflow 原先挂的
      # generate_release_notes 一直没产生内容（1.4.0 / 1.5.0 的说明都是空的），
      # 而 CHANGELOG 本来就是人工维护的真说明。抽不到就报错退出，宁可 CI 红。
      - name: Build release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      # 合成 macOS 双架构的 latest-mac.yml（写到 dist 外，避免被下一次 softprops
      # 上传的动作当成待发布文件上传）
      - name: Merge macOS update metadata
        run: |
          node scripts/merge-mac-update-info.mjs dist/latest-mac-x64.yml dist/latest-mac-arm64.yml > "$RUNNER_TEMP/latest-mac.yml"
          rm dist/latest-mac-x64.yml dist/latest-mac-arm64.yml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 两个 mac job 各自往草稿里传过自己的 latest-mac.yml（同名，后完成的覆盖先
      # 完成的），这里用合并后的版本覆盖。--clobber 是确定的覆盖语义，不依赖
      # action 对同名资产的处理方式。
      - name: Upload merged macOS update metadata
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest-mac.yml" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
