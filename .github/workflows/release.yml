name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # rpm: needed for the rpm target; libarchive-tools: provides bsdtar for the pacman target
          sudo apt-get install -y rpm libarchive-tools

      - name: Build and package
        run: npm run dist:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*
          if-no-files-found: error

  build-windows:
    # 不用 windows-latest：它已经是 windows-2025-vs2026（**Visual Studio 2026**），
    # 而 node-gyp（含 11.x，只映射 major 15/16/17 → 2017/2019/2022）认不出 VS 18，
    # 报 "Could not find any Visual Studio installation to use"——1.5.0 首次发布
    # 实测就是这么挂的（挂在下游 `npm ci` 的 postinstall 重建 better-sqlite3）。
    # windows-2022 仍带 VS 2022，等 node-gyp 支持 VS2026 再考虑换回 latest。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist:win 内部会跑 scripts/fetch-mpv-win.js（GitHub API 查 release →
      # 下载 7z → 解压到 build/mpv-win）；GitHub runner 自带 7-Zip
      - name: Build and package
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*
          if-no-files-found: error

  # mac 的 x64/arm64 必须分架构构建：better-sqlite3 原生模块按 runner
  # 宿主架构编译，arm64 runner 上打出的 x64 包里会是 arm64 模块（Intel
  # 机器上 better-sqlite3 直接加载失败）
  #
  # runner 标签（2026-09 起，见 actions/runner-images README）：`macos-13`
  # 已退役——用它会永远排在队列里（1.5.0 首次发布实测：mac-x64 job
  # queued 30+ 分钟没等到 runner）。macOS 15 之后**不带后缀的标签是
  # arm64**（`macos-15`/`macos-26`/`macos-latest` 全是 arm64），Intel 的
  # 标准标签是 `macos-15-intel`（`*-large` 属于付费大规格，别用）。
  build-mac-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mpv (Homebrew)
        run: brew install mpv

      - name: Build and package
        run: |
          npm run typecheck
          npm run build:main
          npm run build:preload
          npm run build:renderer
          bash scripts/collect-mpv-mac.sh
          npx electron-builder --mac dmg --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-x64-builds
          path: dist/*
          if-no-files-found: error

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mpv (Homebrew)
        run: brew install mpv

      - name: Build and package
        run: |
          npm run typecheck
          npm run build:main
          npm run build:preload
          npm run build:renderer
          bash scripts/collect-mpv-mac.sh
          npx electron-builder --mac dmg --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-builds
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - build-linux
      - build-windows
      - build-mac-x64
      - build-mac-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
