# qy-player custom mpv input bindings
# Loaded via --input-conf; layered on top of mpv's default bindings.

# Track menus (uosc pop-up menus)
a script-binding uosc/audio
c script-binding uosc/subtitles

# Mini window (PiP): on-top + shrunk / restore
P set ontop yes; set window-scale 0.3
O set ontop no; set window-scale 1

# Aspect ratio presets (Ctrl+1..5) + single-key cycle in the MPV window
# NOTE: property name is "video-aspect" on mpv <= 0.32 (renamed to
# "video-aspect-override" in 0.33+)
Ctrl+1 set video-aspect "auto"
Ctrl+2 set video-aspect "16:9"
Ctrl+3 set video-aspect "4:3"
Ctrl+4 set video-aspect "2.35:1"
Ctrl+5 set video-aspect "1:1"
Ctrl+r cycle-values video-aspect "auto" "16:9" "4:3" "2.35:1" "1:1"

# Mouse wheel: volume control (YouTube-style, more natural than default seek)
WHEEL_UP add volume 3
WHEEL_DOWN add volume -3

# Double click: toggle fullscreen
MBTN_LEFT_DBL cycle fullscreen

# Seek presets
RIGHT seek 5
LEFT seek -5
UP add volume 3
DOWN add volume -3
Shift+RIGHT seek 1 exact
Shift+LEFT seek -1 exact

# Show current time / duration on demand
t show-text "${time-pos} / ${duration} (${percent-pos}%)" 1500
