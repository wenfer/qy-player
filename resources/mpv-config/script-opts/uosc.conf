# qy-player modern uosc configuration

# ----------------- 顶部栏 -----------------
top_bar=no-border
top_bar_controls=right
top_bar_title=yes
top_bar_size=38
top_bar_persistency=

# ----------------- 进度条（Timeline） -----------------
timeline_style=line
timeline_line_width=4
timeline_size=42
timeline_border=1
timeline_step=5
timeline_cache=yes
progress=windowed
progress_size=4
progress_line_width=20

# ----------------- 底部播放控制栏（Controls） -----------------
# 菜单 | 上一集 快退10s 播放/暂停 快进10s 下一集 | 字幕 音轨 视频轨 | 编码信息 | 弹性间隔 | 倍速 | 全屏
controls=menu,gap,command:skip_previous:script-message qy-prev-episode?上一集,command:replay_10:seek -10?快退 10 秒,play-pause,command:forward_10:seek 10?快进 10 秒,command:skip_next:script-message qy-next-episode?下一集,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,gap,command:info:script-binding stats/display-stats-toggle?视频与编码信息(i),space,<video,audio>speed,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=4
controls_persistency=paused

# ----------------- 音量与倍速控件 -----------------
volume=right
volume_size=40
volume_border=1
volume_step=2

speed_step=0.1
speed_step_is_factor=no

# ----------------- 颜色与主题（契合 QY Player 深色视觉风格） -----------------
color=foreground=ffffff,foreground_text=000000,background=18181b,background_text=ffffff
opacity=curtain=0.6,buffering_indicator=0.4
pause_indicator=flash
