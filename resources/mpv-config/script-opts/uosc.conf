# qy-player modern uosc configuration

# ----------------- 顶部栏 -----------------
top_bar=no-border
top_bar_controls=right
top_bar_title=yes
top_bar_size=38
top_bar_persistency=

# ----------------- 进度条（Timeline） -----------------
# 底部进度条样式：line（更现代简洁）或 bar
timeline_style=line
timeline_line_width=4
timeline_size=42
timeline_border=1
timeline_step=5
# 开启网络流缓存范围指示器
timeline_cache=yes
# 窗口化时常驻微小进度线（避免完全找不到进度）
progress=windowed
progress_size=3
progress_line_width=20
timeline_cached_ranges=f97316:0.45

# ----------------- 底部播放控制栏（Controls） -----------------
# 自定义按钮组：
# 菜单 | 上一集 播放/暂停 下一集 | 字幕 音轨 视频轨 | 编码信息 | 弹性间隔 | 倍速 | 全屏
controls=menu,gap,prev,play-pause,next,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,gap,command:info:script-binding stats/display-stats-toggle?视频与编码信息(i),space,<video,audio>speed,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=4
controls_persistency=

# ----------------- 音量与倍速控件 -----------------
volume=right
volume_size=40
volume_border=1
volume_step=2

speed_step=0.1
speed_step_is_factor=no

# ----------------- 颜色与主题（契合 QY Player 深色视觉风格） -----------------
color_foreground=ffffff
color_foreground_text=000000
color_background=18181b
color_background_text=ffffff

# 缓冲与遮罩半透明度
curtain_opacity=0.6
buffering_indicator=0.4
pause_indicator=flash
