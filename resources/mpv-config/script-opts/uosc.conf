# qy-player modern uosc configuration

# ----------------- 语言与本地化 -----------------
# 优先加载简体中文 (zh-hans)，缺失时回退到 mpv 的字幕语言或英文
languages=zh-hans,slang,en

# ----------------- 顶部栏 -----------------
top_bar=no-border
top_bar_controls=right
top_bar_title=yes
top_bar_size=38
top_bar_persistency=

# ----------------- 进度条（Timeline） -----------------
timeline_style=line
timeline_line_width=4
timeline_size=42
timeline_border=1
timeline_step=5
timeline_cache=yes
progress=windowed
progress_size=4
progress_line_width=20

# ----------------- 底部播放控制栏（Controls） -----------------
# 播放控制（左）: 播放/暂停 | 上一集 快退10s 快进10s 下一集
# 状态与工具（右）: 字幕 | 音轨 | 视频轨 | 编码信息 | 倍速 | 菜单 | 全屏
controls=play-pause?播放/暂停,gap,button:prev-episode,command:replay_10:seek -10?快退 10 秒,command:forward_10:seek 10?快进 10 秒,button:next-episode,gap,space,subtitles?字幕,<has_many_audio>audio?音频,<has_many_video>video?视频轨,command:info:script-binding stats/display-stats-toggle?视频与编码信息(i),gap,<video,audio>speed,gap,menu?菜单,fullscreen?全屏
controls_size=36
controls_margin=12
controls_spacing=6
controls_persistency=paused

# ----------------- 音量与倍速控件 -----------------
volume=right
volume_size=40
volume_border=1
volume_step=2

speed_step=0.1
speed_step_is_factor=no

# ----------------- 颜色与主题（契合 QY Player 深色视觉风格） -----------------
color=foreground=ffffff,foreground_text=000000,background=18181b,background_text=ffffff
opacity=curtain=0.6,buffering_indicator=0.4
pause_indicator=flash
