# thumbfast configuration for qy-player

# Thumbnail dimensions (max pixels)
max_height=200
max_width=200

# Enable on network playback (Emby / Jellyfin / WebDAV)
network=yes

# Obey software decoding constraint
hwdec=no

# Automatically shut down background thumbnailer after 60s of inactivity
quit_after_inactivity=60
