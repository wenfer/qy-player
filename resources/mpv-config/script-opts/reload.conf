# mpv-reload configuration for qy-player

# Enable automatic reload on stuck buffering
paused_for_cache_timer_enabled=yes
paused_for_cache_timer_interval=1
paused_for_cache_timer_timeout=6

# Enable reload based on depleted demuxer cache
demuxer_cache_timer_enabled=yes
demuxer_cache_timer_interval=2
demuxer_cache_timer_timeout=15

# Avoid conflict with aspect ratio cycle (Ctrl+r)
reload_key_binding=Ctrl+Shift+r
